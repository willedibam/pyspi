name: Slow Regression Suite

# The slow suite compares every SPI against frozen baseline tables and takes
# roughly 12 minutes, so it is not run per-push. Weekly + on demand.
on:
  schedule:
    # 04:00 UTC every Monday.
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  slow-test:
    name: regression (ubuntu / python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install pyspi
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[testing]'

      - name: Run regression tests
        run: pytest -m slow
