# benchmarked_config.yaml
# Derived from the pyspi-fork superset config.yaml with SPIs heavier than ~5s
# per invocation at (M=8,T=3200) AND (M=16,T=800) removed.
#
# Source: benchmark_spis_ge5s_M8T3200_vs_M16T800.json "both" section (36 SPIs).
# Expected SPI count: 328 - 36 = 292.
#
# Dropped whole classes:
#   distance:  HellerHellerGorfine, MultiscaleGraphCorrelation,
#              CrossMultiscaleGraphCorrelation, CrossDistanceCorrelation,
#              DistanceCorrelation, HilbertSchmidtIndependenceCriterion,
#              SoftDynamicTimeWarping
#   causal:    AdditiveNoiseModel
#   misc:      GPModel
# Partial drops:
#   distance:  Barycenter (dropped mode in {dtw,sgddtw,softdtw} x stat=mean, non-squared)
#   causal:    ConvergentCrossMapping (dropped statistic=mean at every E)
#   infotheory: CausalEntropy (kernel), CrossmapEntropy (kernel+k=10),
#               DirectedInfo (kernel),
#               TransferEntropy (kraskov auto-embed +- DCE, and DCE k=1/2 l=1)
#   spectral:  {DirectDirectedTransferFunction, DirectedCoherence,
#               DirectedTransferFunction, GeneralizedPartialDirectedCoherence,
#               PartialDirectedCoherence}: dropped bare `- fs: 1` (stat=mean)
#   wavelet:   PhaseSlopeIndex: dropped `- fs: 1` and `- fmin:0,fmax:0.25`

